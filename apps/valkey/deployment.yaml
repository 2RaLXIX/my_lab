apiVersion: apps/v1
kind: Deployment

metadata:
  name: valkey
  namespace: gitea

spec:
  replicas: 1

  selector:
    matchLabels:
      app: valkey

  template:
    metadata:
      labels:
        app: valkey

    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1

          ports:
            - containerPort: 6379

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 128Mi

          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5