apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: car-catalog

resources:
  - namespace.yaml
  - sealedsecret.yaml      # создаёт scripts/seal-car-catalog-secrets.sh, без него sync упадёт
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Страница и конфиг nginx лежат в ConfigMap с хэшем в имени:
# правка site/index.html -> commit -> новый ConfigMap -> rolling update. Свой образ не нужен.
configMapGenerator:
  - name: car-catalog-site
    files:
      - site/index.html
  - name: car-catalog-nginx
    files:
      - default.conf=nginx.conf
