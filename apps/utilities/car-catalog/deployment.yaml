apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-catalog
  namespace: car-catalog
  labels: {app: car-catalog}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app: car-catalog}
  template:
    metadata:
      labels: {app: car-catalog}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        # --- статика + reverse proxy на PostgREST ---
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: site, mountPath: /usr/share/nginx/html, readOnly: true}
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}

        # --- read-only REST поверх view api.cars ---
        - name: postgrest
          image: postgrest/postgrest:v16.4   # multi-arch, есть linux/arm64
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef: {name: car-catalog-db, key: uri}
            - {name: PGRST_DB_SCHEMAS, value: api}
            - {name: PGRST_DB_ANON_ROLE, value: car_anon}
            - {name: PGRST_DB_POOL, value: "2"}
            - {name: PGRST_DB_MAX_ROWS, value: "2000"}
            - {name: PGRST_SERVER_HOST, value: "127.0.0.1"}   # снаружи пода недоступен, только через nginx
            - {name: PGRST_SERVER_PORT, value: "3000"}
            - {name: PGRST_ADMIN_SERVER_PORT, value: "3001"}
            - {name: PGRST_OPENAPI_MODE, value: disabled}
            - {name: PGRST_LOG_LEVEL, value: warn}
            - {name: PGRST_DB_CHANNEL_ENABLED, value: "true"}   # NOTIFY pgrst, 'reload schema' перечитывает view без рестарта
          ports:
            - {name: admin, containerPort: 3001}
          readinessProbe:
            httpGet: {path: /ready, port: admin}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /live, port: admin}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            capabilities: {drop: [ALL]}
      volumes:
        - name: site
          configMap: {name: car-catalog-site}
        - name: nginx-conf
          configMap: {name: car-catalog-nginx}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
