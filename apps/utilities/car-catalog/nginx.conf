server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # публичный каталог
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }

    # админка — та же страница, режим включается по пути; basicAuth на /admin вешает Traefik
    location = /admin { return 301 /admin/; }
    location /admin/ { try_files /index.html =404; add_header Cache-Control "no-cache"; }

    # PostgREST в том же поде, только чтение
    location /api/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    location / { return 404; }
}
