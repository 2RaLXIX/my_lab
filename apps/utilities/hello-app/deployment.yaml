apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-app
  namespace: hello-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: hello-app

  template:
    metadata:
      labels:
        app: hello-app

    spec:
      containers:
      - name: hello-app
        image: docker.home.arpa/hello-app:69887fb08d193b5cbb67869fc88b5b3d11fa6501

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
