apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-app
  namespace: hello-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: hello-app

  template:
    metadata:
      labels:
        app: hello-app

    spec:
      containers:
      - name: hello-app
        image: docker.home.arpa/hello-app:ab1072dd98abe112e5bd025cd9494300b0d24dbc

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
