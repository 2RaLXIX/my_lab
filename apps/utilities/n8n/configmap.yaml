apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
  namespace: n8n
data:
  N8N_HOST: "n8n.home.arpa"
  N8N_PROTOCOL: "https"
  N8N_PORT: "5678"
  WEBHOOK_URL: "https://n8n.home.arpa/"
  GENERIC_TIMEZONE: "Asia/Baku"
  TZ: "Asia/Baku"
  N8N_DEFAULT_BINARY_DATA_MODE: "filesystem"
  N8N_RUNNERS_ENABLED: "true"
  N8N_METRICS: "false"
  N8N_EMAIL_MODE: "smtp"
  N8N_SMTP_HOST: "smtp.gmail.com"
  N8N_SMTP_PORT: "465"
  N8N_SMTP_USER: "tural.hajibayli19@gmail.com"
  N8N_SMTP_SENDER: "n8n Home <tural.hajibayli19@gmail.com>"
  N8N_SMTP_SSL: "true"
  
  # === Новые параметры для боевого режима ===
  # Оптимизация памяти движка V8 (Node.js) под лимиты пода
  NODE_OPTIONS: "--max-old-space-size=800"
  
  # Автоматическая очистка старых логов (чтобы база не тормозила)
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "168" # Хранить успешные логи 7 дней
  EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"
  
  # Подключение к PostgreSQL (используем твой инстанс из gitea)
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "postgres-1.gitea.svc.cluster.local"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n"