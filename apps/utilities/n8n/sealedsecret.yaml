# ЗАГЛУШКА — не коммить as-is.
# Сгенерируй реальный SealedSecret скриптом scripts/seal-n8n-secret.sh
# ЗАПУЩЕННЫМ ИЗ НАСТОЯЩЕГО ТЕРМИНАЛА НА ЭТОМ МАКЕ (с доступом до кластера),
# а не через Claude-мостик — у него нет маршрута до твоей домашней LAN.
#
# Компонент, который шифруется: N8N_ENCRYPTION_KEY.
# Это критично — если ключ потеряется или изменится при передеплое,
# все сохранённые credentials в существующих workflow перестанут расшифровываться.
# Один раз сгенерировал -> храни этот же SealedSecret навсегда, не перегенерируй.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: n8n-secret
  namespace: n8n
spec:
  encryptedData:
    N8N_ENCRYPTION_KEY: Ch/o+ULDCoeW2x5YHwvFOO/CpNuiKqRnmFO5E3s3eGo=
  template:
    metadata:
      name: n8n-secret
      namespace: n8n
    type: Opaque
