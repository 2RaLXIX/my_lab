apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-cleanup

spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never

          initContainers:

          - name: prune-old-tags
            image: python:3-alpine
            command: ["python3", "/scripts/cleanup.py"]
            volumeMounts:
            - name: cleanup-script
              mountPath: /scripts

          containers:

          - name: garbage-collect
            image: registry:2
            command: ["registry", "garbage-collect", "/etc/docker/registry/config.yml"]
            volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry

          volumes:
          - name: cleanup-script
            configMap:
              name: registry-cleanup-script
          - name: registry-data
            persistentVolumeClaim:
              claimName: docker-registry-pvc
