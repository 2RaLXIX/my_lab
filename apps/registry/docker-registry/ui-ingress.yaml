apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-registry-ui
spec:
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: local-ca
  tls:
    - hosts:
        - registry-ui.home.arpa
      secretName: registry-ui-tls
  rules:
    - host: registry-ui.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docker-registry-ui
                port:
                  number: 80