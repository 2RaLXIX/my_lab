apiVersion: apps/v1
kind: Deployment

metadata:
  name: uptime-kuma
  namespace: monitoring

spec:
  replicas: 3

  selector:
    matchLabels:
      app: uptime-kuma

  template:
    metadata:
      labels:
        app: uptime-kuma

    spec:
      containers:
      - name: uptime-kuma
        image: louislam/uptime-kuma:1

        ports:
        - containerPort: 3001

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "512Mi"
            cpu: "500m"
