apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: postgres
  namespace: gitea

spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:17

  storage:
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  bootstrap:
    initdb:
      database: gitea
      owner: gitea

      secret:
        name: gitea-db-secret

  # Роли, которыми управляет оператор. Роли, которых здесь нет
  # (gitea, n8n_user), CNPG не трогает.
  managed:
    roles:
      # роль PostgREST для каталога car-catalog: только чтение view api.cars
      - name: car_anon
        ensure: present
        login: false
        comment: "car-catalog: read-only api.cars"
      - name: car_web
        ensure: present
        login: true
        inherit: false            # своих прав нет, только SET ROLE car_anon
        connectionLimit: 10
        inRoles: [car_anon]
        passwordSecret:
          name: car-web-db        # sealedsecret-car-web.yaml, создаёт scripts/seal-car-catalog-secrets.sh
        comment: "car-catalog: PostgREST authenticator"
