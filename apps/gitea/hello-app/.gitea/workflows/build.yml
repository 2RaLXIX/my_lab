  on:
    push:
      branches: [main]

  jobs:
    build-and-push:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Build image
          run: docker build -t docker.home.arpa/hello-app:${{ gitea.sha }} .

        - name: Push image
          run: docker push docker.home.arpa/hello-app:${{ gitea.sha }}
