apiVersion: apps/v1
kind: Deployment

metadata:
  name: gitea
  namespace: gitea

spec:

  replicas: 1

  selector:
    matchLabels:
      app: gitea

  template:

    metadata:
      labels:
        app: gitea

    spec:

      containers:

      - name: gitea

        image: docker.gitea.com/gitea:1.24.6-rootless

        ports:

        - containerPort: 3000

        - containerPort: 22

        env:

        - name: GITEA__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: gitea-secret
              key: GITEA__database__PASSWD

        - name: GITEA__security__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: gitea-secret
              key: GITEA__security__SECRET_KEY

        - name: GITEA__security__INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-secret
              key: GITEA__security__INTERNAL_TOKEN

        - name: GITEA__oauth2__JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gitea-secret
              key: GITEA__oauth2__JWT_SECRET

        - name: GITEA__server__LFS_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gitea-secret
              key: GITEA__server__LFS_JWT_SECRET

        volumeMounts:

        - name: data
          mountPath: /data

        - name: config
          mountPath: /etc/gitea/app.ini
          subPath: app.ini

      volumes:

      - name: data
        persistentVolumeClaim:
          claimName: gitea-data

      - name: config
        configMap:
          name: gitea-config