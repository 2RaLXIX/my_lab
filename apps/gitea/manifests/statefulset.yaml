apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: gitea
  namespace: gitea

spec:
  serviceName: gitea

  replicas: 1

  selector:
    matchLabels:
      app: gitea

  template:
    metadata:
      labels:
        app: gitea

    spec:

      securityContext:
        fsGroup: 1000

      containers:

      - name: gitea

        image: docker.gitea.com/gitea:1.24.6-rootless

        imagePullPolicy: IfNotPresent

        ports:

        - containerPort: 3000
          name: http

        - containerPort: 2222
          name: ssh

        env:

        - name: USER_UID
          value: "1000"

        - name: USER_GID
          value: "1000"

        - name: GITEA__server__DOMAIN
          value: gitea.home.arpa

        - name: GITEA__server__ROOT_URL
          value: http://gitea.home.arpa/

        - name: GITEA__server__SSH_DOMAIN
          value: gitea.home.arpa

        - name: GITEA__server__SSH_PORT
          value: "22"

        - name: GITEA__server__START_SSH_SERVER
          value: "true"

        - name: GITEA__server__SSH_LISTEN_PORT
          value: "2222"

        - name: GITEA__database__DB_TYPE
          value: postgres

        - name: GITEA__database__HOST
          value: postgres-rw.gitea.svc.cluster.local:5432

        - name: GITEA__database__NAME
          value: gitea

        - name: GITEA__database__USER
          value: gitea

        - name: GITEA__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: gitea-secret
              key: GITEA__database__PASSWD

        - name: GITEA__cache__ADAPTER
          value: redis

        - name: GITEA__cache__HOST
          value: network=tcp,addr=valkey.gitea.svc.cluster.local:6379

        - name: GITEA__session__PROVIDER
          value: redis

        - name: GITEA__session__PROVIDER_CONFIG
          value: network=tcp,addr=valkey.gitea.svc.cluster.local:6379

        - name: GITEA__security__INSTALL_LOCK
          value: "true"

        - name: GITEA__service__DISABLE_REGISTRATION
          value: "true"

        - name: GITEA__actions__ENABLED
          value: "true"

        - name: GITEA__security__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: gitea-secret
              key: GITEA__security__SECRET_KEY

        - name: GITEA__security__INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-secret
              key: GITEA__security__INTERNAL_TOKEN

        - name: GITEA__oauth2__JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gitea-secret
              key: GITEA__oauth2__JWT_SECRET

        - name: GITEA__server__LFS_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gitea-secret
              key: GITEA__server__LFS_JWT_SECRET

        resources:

          requests:
            cpu: 100m
            memory: 256Mi

          limits:
            cpu: 1000m
            memory: 1Gi

        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20

        startupProbe:
          httpGet:
            path: /
            port: 3000
          periodSeconds: 5
          failureThreshold: 60

        volumeMounts:

        - name: data
          mountPath: /var/lib/gitea

      volumes:

      - name: data
        persistentVolumeClaim:
          claimName: gitea-data