apiVersion: v1
kind: ConfigMap

metadata:
  name: gitea-runner-config
  namespace: gitea

data:

  config.yaml: |
    log:
      level: info

    runner:
      file: .runner
      capacity: 1
      envs: {}
      env_file: .env
      timeout: 3h
      shutdown_timeout: 0s
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      labels:
        - "ubuntu-latest:docker://gitea/runner-images:ubuntu-latest"
        - "ubuntu-22.04:docker://gitea/runner-images:ubuntu-22.04"
        - "ubuntu-20.04:docker://gitea/runner-images:ubuntu-20.04"

    cache:
      enabled: true
      dir: ""
      host: ""
      port: 0
      external_server: ""

    container:
      network: ""
      privileged: false
      options:
      workdir_parent:
      valid_volumes: []
      docker_host: "unix:///var/run/docker.sock"
      force_pull: true
      force_rebuild: false

    host:
      workdir_parent:
