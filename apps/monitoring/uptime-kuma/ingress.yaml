apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: uptime-kuma
  namespace: monitoring

spec:
  ingressClassName: traefik

  rules:
  - host: uptime-kuma.home.arpa

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: uptime-kuma
            port:
              number: 3001
